<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day Logger</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="app-layout">
    <!-- БОКОВАЯ ПАНЕЛЬ -->
    <aside class="sidebar">
      <div class="nav-item active" data-view="home" title="Logger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
      <div class="nav-item" data-view="calendar" title="Calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      </div>
      <div class="nav-item" data-view="charts" title="Analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      </div>
      <div class="nav-item" data-view="settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </div>
    </aside>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="main-content">
      
      <!-- ВКЛАДКА 1: ЛОГГЕР (Главная) -->
      <div id="view-home" class="view active">
        <div class="top-controls">
          <input type="date" id="date-picker">
          <button id="today-btn" type="button">Today</button>
        </div>

        <div class="layout-container">
          <div class="timeline-col">
            <div class="timeline-wrapper">
              <div class="timeline-header">
                <div class="time-display" id="active-time">00:00</div>
              </div>
              <div class="playhead"></div>
              <div class="timeline-scroll" id="timeline-scroll">
                <div class="blocks" id="timeline"></div>
              </div>
            </div>
            <p class="hint">Крути колесико мыши, чтобы листать по 30 минут →</p>
          </div>

          <div class="score-col">
            <div class="score-card">
              <div class="score-circle" id="score-value">0</div>
            </div>
          </div>
        </div>
      </div>

      <!-- ВКЛАДКА 2: КАЛЕНДАРЬ -->
      <div id="view-calendar" class="view">
        <div class="heatmap-section">
          <h3>Activity Density</h3>
          <p class="heatmap-desc">Цвет категории. Яркость = количество заполненных блоков.</p>
          <div class="heatmap-scroll">
            <div id="heatmap-activity" class="heatmap-grid"></div>
          </div>
        </div>

        <div class="heatmap-section">
          <h3>Day Balance</h3>
          <p class="heatmap-desc">Яркость = эффективность дня (0-100).</p>
          <div class="heatmap-scroll">
            <div id="heatmap-score" class="heatmap-grid"></div>
          </div>
        </div>
      </div>

            <!-- ВКЛАДКА 3: ГРАФИКИ -->
      <div id="view-charts" class="view">
        <h2>Analytics</h2>
        <div class="charts-container">
          <div class="chart-box"><canvas id="distChart"></canvas></div>
          <div class="chart-box"><canvas id="historyChart"></canvas></div>
          <div class="chart-box"><canvas id="hourlyChart"></canvas></div>
          <div class="chart-box"><canvas id="dowChart"></canvas></div>
        </div>
      </div>

 <!-- ВКЛАДКА 4: НАСТРОЙКИ -->
      <div id="view-settings" class="view">
        <h2>Settings</h2>
        <div class="settings-box">
          <label>Color Theme</label>
            <div class="theme-options">
            <button class="theme-btn active" data-theme="midnight">Midnight</button>
            <button class="theme-btn" data-theme="nord">Nord</button>
            <button class="theme-btn" data-theme="light">Light</button>
            <button class="theme-btn" data-theme="matrix">Matrix</button>
          </div>
        </div>
      </div>

  <!-- МОДАЛКА -->
  <div class="modal" id="modal" hidden>
    <div class="modal-content">
      <h2 id="modal-title">What happened?</h2>
      <div class="category-select" id="category-select"></div>
      <div class="modal-actions">
        <button id="delete-btn" type="button" hidden>Delete</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
