<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Block Planner</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Time Block Planner</h1>
    <div class="controls">
      <input type="date" id="date-picker">
      <button id="today-btn" type="button">Today</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <main>
    <div class="timeline" id="timeline"></div>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-content">
      <h2 id="modal-title">Add block</h2>

      <div class="form-group">
        <label>Category</label>
        <div class="category-select" id="category-select"></div>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select id="status-select">
          <option value="done">Done</option>
          <option value="skipped">Skipped</option>
          <option value="planned">Planned</option>
        </select>
      </div>

      <div class="form-group">
        <label>Energy (1–5)</label>
        <input type="range" id="energy-input" min="1" max="5" value="3">
        <span id="energy-value">3</span>
      </div>

      <div class="form-group">
        <label>Notes</label>
        <textarea id="notes-input" rows="2" maxlength="500"></textarea>
      </div>

      <div class="modal-actions">
        <button id="delete-btn" type="button" hidden>Delete</button>
        <button id="cancel-btn" type="button">Cancel</button>
        <button id="save-btn" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
