<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day Logger</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- Подключаем Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>Day Logger</h1>
    <div class="controls">
      <input type="date" id="date-picker">
      <button id="today-btn" type="button">Today</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <main class="layout-container">
    <!-- Левая колонка: Логгер -->
    <div class="timeline-col">
      <div class="timeline-wrapper">
        <div class="timeline-header">
          <div class="time-display" id="active-time">00:00</div>
        </div>
        <div class="playhead"></div>
        <div class="timeline-scroll" id="timeline-scroll">
          <div class="blocks" id="timeline"></div>
        </div>
      </div>
      <p class="hint">Крути колесико мыши, чтобы листать по 30 минут →</p>

      <!-- НОВЫЙ БЛОК: ГРАФИКИ -->
      <div class="charts-container">
        <div class="chart-box">
          <canvas id="distChart"></canvas>
        </div>
        <div class="chart-box">
          <canvas id="historyChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Правая колонка: Поинты -->
    <div class="score-col">
      <div class="score-card">
        <div class="score-circle" id="score-value">0</div>
      </div>
    </div>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-content">
      <h2 id="modal-title">What happened?</h2>
      <div class="category-select" id="category-select"></div>
      <div class="modal-actions">
        <button id="delete-btn" type="button" hidden>Delete</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
